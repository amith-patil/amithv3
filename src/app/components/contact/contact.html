<section id="contact"
    class="relative min-h-[60vh] w-full bg-neutral-950 py-24 px-6 md:px-12 border-t border-white/5 overflow-hidden">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-[1fr_auto] gap-12 md:gap-24 items-center">

        <div class="flex flex-col items-center md:items-start text-center md:text-left order-2 md:order-1">

            <h2 appReveal
                class="font-google-sans text-white text-3xl md:text-5xl lg:text-6xl font-light tracking-tight mb-12 max-w-2xl reveal-on-scroll reveal-left">
                Let's get <span class="italic text-white/40">securing</span> your enterprise.
            </h2>

            <div class="relative group">
                <div
                    class="absolute -inset-1 bg-orange-500 opacity-20 blur-xl group-hover:opacity-40 transition-all duration-500">
                </div>

                <a appReveal href="mailto:amithpatil1993@gmail.com"
                    class="relative flex items-center gap-4 px-10 py-5 bg-orange-500 text-white font-google-sans font-bold uppercase tracking-[0.2em] text-sm md:text-base transition-all duration-300 hover:scale-105 active:scale-95 reveal-on-scroll reveal-left"
                    style="clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);">

                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2" />
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    </svg>

                    <span>Send Message</span>
                </a>
            </div>

            <div class="mt-16 flex flex-col md:flex-row items-center gap-8 md:gap-12">
                <div class="group relative flex items-center gap-3 px-4 py-2 bg-emerald-500/10 border border-emerald-500/30 hover:border-emerald-500 hover:bg-emerald-500/30 transition-all duration-300
                    after:absolute after:w-[8.5px] after:h-px after:bg-emerald-500/30 after:bottom-0.5 after:right-0.5 after:translate-x-1/2 after:translate-y-1/2 after:-rotate-45 after:transition-colors after:duration-300 hover:after:bg-emerald-500"
                    style="clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);">
                    <span class="relative flex h-2 w-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                        <span
                            class="relative inline-flex rounded-full h-2 w-2 bg-orange-500 shadow-[0_0_8px_rgba(249,115,22,0.8)]"></span>
                    </span>
                    <span
                        class="font-mono text-[10px] uppercase tracking-widest text-white/80 group-hover:text-white cursor-default">
                        Available for new projects
                    </span>
                </div>

                <div class="flex gap-8">
                    <a *ngFor="let social of socialLinks" [href]="social.url" target="_blank"
                        class="text-white/20 hover:text-white hover:-translate-y-1 transition-all duration-300 ease-in-out"
                        [title]="social.name">
                        <i class="fab text-xl" [ngClass]="social.icon"></i>
                    </a>
                </div>
            </div>
        </div>

        <div
            class="hidden md:flex flex-col items-center justify-center self-stretch border-l border-white/10 pl-12 order-1 md:order-2">
            <h2 class="font-google-sans text-6xl lg:text-8xl font-bold uppercase tracking-[0.2em] text-transparent select-none hover:text-orange-500 transition-colors duration-500"
                style="-webkit-text-stroke: 1px rgba(255, 255, 255, 0.15); writing-mode: vertical-rl; transform: rotate(0deg);">
                Contact
            </h2>
            <div class="w-px h-24 bg-orange-500 mt-8"></div>
        </div>

        <div class="md:hidden order-1">
            <h2 class="font-google-sans text-4xl font-bold uppercase tracking-widest text-orange-500 mb-4 text-center">
                Contact
            </h2>
            <div class="h-px w-12 bg-white/20 mx-auto"></div>
        </div>
    </div>
</section>
