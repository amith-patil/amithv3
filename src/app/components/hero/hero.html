<section class="relative h-screen w-full flex items-center justify-center bg-cover bg-center bg-no-repeat select-none"
    style="background-image: url('/leaves.jpg');" [style.background-position-y.px]="scrollY">

    <div
        class="absolute right-0 top-0 h-full w-full bg-[radial-gradient(circle_at_0_0,rgba(255,255,255,0.15)_2px,transparent_2px),linear-gradient(to_right,rgba(255,255,255,0.05)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,0.05)_1px,transparent_1px)] bg-size-[60px_60px] pointer-events-none z-0">
    </div>

    <div class="relative z-20 w-full h-full max-w-7xl mx-auto px-6 flex flex-col justify-center">

        <div class="text-center md:text-left">
            <p
                class="font-google-sans text-orange-500 text-[10px] md:text-xs tracking-[0.6em] uppercase mb-8 md:mb-16 font-semibold">
                Security // 2026
            </p>

            <h1
                class="font-smooch text-white text-[clamp(5rem,12vw,16rem)] leading-[0.8] drop-shadow-2xl mb-4 logo-path">
                Amith Patil
            </h1>

            <div class="flex flex-wrap items-baseline justify-center md:justify-start gap-x-3 md:gap-x-5">

                <h2 class="font-google-sans font-extralight text-white text-2xl md:text-3xl lg:text-3xl tracking-tight">
                    Solutions Engineer @
                </h2>
                <span class="font-google-sans font-bold text-2xl md:text-3xl lg:text-3xl tracking-tighter inline-flex">
                    <span class="text-[#4285F4]">G</span>
                    <span class="text-[#EA4335]">o</span>
                    <span class="text-[#FBBC05]">o</span>
                    <span class="text-[#4285F4]">g</span>
                    <span class="text-[#34A853]">l</span>
                    <span class="text-[#EA4335]">e</span>
                </span>
            </div>

            <p class="pt-2 mb-10 font-google-sans font-extralight text-white/40 text-sm md:text-xl tracking-widest">
                "I break things and I fix things."
            </p>

            <div class="relative group inline-block">
                <a href="#contact"
                    class="fill-btn relative flex items-center gap-4 px-8 py-4 text-white font-google-sans font-bold uppercase tracking-[0.2em] text-xs md:text-sm transition-all duration-300 delay-100 hover:scale-105 active:scale-95"
                    style="clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);">

                    <span
                        class="relative z-10 flex items-center gap-4 group-hover:text-black transition-colors duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2" />
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                        </svg>
                        <span>Let's Talk</span>
                    </span>
                </a>
            </div>
        </div>

        <div class="absolute bottom-12 right-0 left-0 md:left-auto px-8 md:px-0 text-center md:text-right max-w-lg">
            <div class="space-y-4">
                <p class="font-google-sans text-white text-lg md:text-3xl font-light leading-snug">
                    Supporting Enterprises with <br class="hidden md:block" />
                    <span class="text-orange-500 font-normal border-b border-orange-500/40">AI & Security</span>
                    <span class="block md:inline"> for the modern web.</span>
                </p>

                <div class="h-px w-20 ml-auto bg-white/20 hidden md:block"></div>

                <div class="flex justify-center md:justify-end">
                    <p
                        class="font-google-sans font-medium text-white/70 text-[10px] md:text-xs tracking-[0.4em] uppercase py-2 px-4 border border-white/10 rounded-full md:border-none md:p-0">
                        10+ Years of Experience
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
