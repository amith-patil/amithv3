<div class="relative h-screen w-full bg-white p-0.5"
    style="clip-path: polygon(0 0, calc(100% - 35px) 0, 100% 35px, 100% 100%, 35px 100%, 0 calc(100% - 35px));">
    <section aria-label="Introduction and Overview" class="relative h-full w-full flex flex-col justify-between bg-neutral-950 select-none overflow-hidden"
        style="clip-path: polygon(0 0, calc(100% - 35px) 0, 100% 35px, 100% 100%, 35px 100%, 0 calc(100% - 35px));">
        <div [style.--parallax-y]="(scrollY * 0.3) + 'px'"
            class="translate-y-(--parallax-y) absolute inset-0 bg-[radial-gradient(circle_at_0_0,rgba(255,255,255,0.15)_2px,transparent_2px),linear-gradient(to_right,rgba(255,255,255,0.05)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,0.05)_1px,transparent_1px)] bg-size-[60px_60px] pointer-events-none z-0">
        </div>

        <div class="hero-logo-bg pointer-events-none absolute bottom-0 right-0 z-1 opacity-20 max-sm:scale-50 sm:max-lg:scale-75 origin-bottom-right"
            [style.translate]="'-5% 12%'" [style.transform]="'translate(' + logoX + 'px, ' + logoY + 'px)'">
            <svg class="hero-bg-logo" viewBox="-15 -15 400 285" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <line x1="173.3" y1="53.8" x2="230.6" y2="-3.4" stroke="white" stroke-width="1" />
                <line x1="226.5" y1="-3.6" x2="368.1" y2="160.8" stroke="white" stroke-width="1" />
                <line x1="368.3" y1="156.4" x2="311.0" y2="213.7" stroke="white" stroke-width="1" />
                <line x1="319.4" y1="210.7" x2="125.0" y2="210.7" stroke="white" stroke-width="1" />
                <line x1="138.0" y1="204.5" x2="96.1" y2="256.5" stroke="white" stroke-width="1" />
                <line x1="101.0" y1="254.1" x2="-5.0" y2="255.5" stroke="white" stroke-width="1" />
                <line x1="-3.9" y1="257.8" x2="125.3" y2="97.4" stroke="white" stroke-width="1" />
                <line x1="120.4" y1="99.7" x2="223.7" y2="98.4" stroke="white" stroke-width="1" />
                <line x1="221.0" y1="104.6" x2="173.5" y2="49.4" stroke="white" stroke-width="1" />
                <line x1="150.0" y1="179.7" x2="293.7" y2="179.7" stroke="white" stroke-width="1" />
                <line x1="290.9" y1="185.8" x2="214.5" y2="97.0" stroke="white" stroke-width="1" />
                <line x1="224.7" y1="96.9" x2="153.0" y2="185.9" stroke="white" stroke-width="1" />
            </svg>
        </div>
        <div class="relative z-20 w-full h-full max-w-5/6 mx-auto px-6">
            <div [style.--parallax-y]="(scrollY * 0.5) + 'px'"
                class="translate-y-(--parallax-y) absolute top-30 md:top-50 md:right-12 left-0 md:left-auto px-8 md:px-0 text-center md:text-right max-w-lg">
                <div appReveal class="space-y-4 reveal-on-scroll reveal-right delay-2800">
                    <p class="font-google-sans text-white text-lg md:text-3xl font-light leading-snug">
                        Supporting Enterprises with <br class="hidden md:block" />
                        <span class="text-orange-500 font-normal underline">AI & Security</span>
                        <span class="block md:inline"> for the modern web.</span>
                    </p>

                    <div class="h-px w-20 ml-auto bg-white/20 hidden md:block"></div>

                    <div class="flex justify-center md:justify-end">
                        <p
                            class="font-google-sans font-medium text-white/70 text-[10px] md:text-xs tracking-[0.4em] uppercase py-2 px-4 border border-white/10 md:border-none md:p-0">
                            10+ Years of Experience
                        </p>
                    </div>
                </div>
            </div>
            <div [style.--parallax-y]="(scrollY * 0.7) + 'px'"
                class="translate-y-(--parallax-y) absolute bottom-12 md:bottom-12 left-0 z-10 w-full flex items-end justify-center px-4 sm:px-6 md:px-12 pb-6 md:pb-12">
                <div class="w-full mx-auto flex flex-col justify-between overflow-visible">
                    <div class="flex flex-wrap items-baseline gap-x-3 mb-2">
                        <h1 appReveal
                            class="w-full font-google-sans font-bold text-white text-[clamp(6.8rem,11.8vw,20.5rem)] leading-none tracking-tight select-none md:whitespace-nowrap text-start md:text-left reveal-on-scroll reveal-up delay-3000">
                            Amith Patil
                        </h1>
                        <h2 appReveal
                            class="font-mono font-extralight text-orange-500 text-lg md:text-2xl lg:text-3xl tracking-tight underline reveal-on-scroll text-center reveal-up delay-3100">
                            Senior Solutions Engineer
                        </h2>
                        <h2 appReveal
                            class="font-google-sans font-extralight text-white text-lg md:text-2xl lg:text-3xl tracking-tight reveal-on-scroll text-center reveal-up delay-3200">
                            @ Google.</h2>
                    </div>

                </div>
            </div>
        </div>
    </section>
</div>
