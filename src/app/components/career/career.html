<section id="career" aria-label="Career Experience"
    class="relative min-h-screen w-full bg-neutral-950 py-24 px-6 md:px-12 border-t border-white/5 overflow-hidden">

    <div class="max-w-7xl mx-auto mb-16 grid grid-cols-1 md:grid-cols-[auto_1fr] gap-12">

        <div appReveal
            class="hidden md:flex flex-col items-center border-r border-white/10 pr-12 reveal-on-scroll reveal-right">
            <h2 class="font-google-sans text-6xl lg:text-8xl font-bold uppercase tracking-[0.2em] text-transparent select-none hover:text-orange-500 transition-colors duration-500"
                style="-webkit-text-stroke: 1px rgba(255, 255, 255, 0.15); writing-mode: vertical-lr; transform: rotate(180deg);">
                Career
            </h2>
            <div class="w-px h-24 bg-orange-500 mt-8" aria-hidden="true"></div>
        </div>

        <div appReveal class="md:hidden reveal-on-scroll reveal-left">
            <h2 class="font-google-sans text-4xl font-bold uppercase tracking-widest text-orange-500 mb-4 text-center">
                Career</h2>
            <div class="h-px w-12 bg-white/20 mx-auto" aria-hidden="true"></div>
        </div>

        <div class="relative mt-12 md:mt-0 w-full space-y-4">
            <div *ngFor="let stage of careerStages; let index = index;" appReveal
                class="group relative border border-white/10 bg-neutral-900/40 hover:border-orange-500/50 transition-all duration-300 overflow-hidden reveal-on-scroll reveal-left"
                [style.clip-path]="'polygon(0 0, 98% 0, 100% 12px, 100% 100%, 2% 100%, 0 calc(100% - 12px))'">

                <div
                    class="absolute left-0 top-0 w-2 h-2 border-t-2 border-l-2 border-orange-500 opacity-0 group-hover:opacity-100 transition-opacity" aria-hidden="true">
                </div>
                <div
                    class="absolute right-0 bottom-0 w-2 h-2 border-b-2 border-r-2 border-orange-500 opacity-0 group-hover:opacity-100 transition-opacity" aria-hidden="true">
                </div>
                <div (click)="toggleStage(index)"
                    (keydown.enter)="toggleStage(index)"
                    (keydown.space)="toggleStage(index); $event.preventDefault()"
                    [id]="'stage-header-' + index"
                    [attr.aria-controls]="'stage-panel-' + index"
                    [attr.aria-expanded]="activeStageIndex === index"
                    role="button"
                    tabindex="0"
                    class="w-full flex items-center justify-between p-5 md:p-6 cursor-pointer text-left select-none relative z-10 transition-colors duration-300 focus-visible:ring-2 focus-visible:ring-orange-500 focus-visible:outline-hidden"
                    [class.bg-orange-500]="activeStageIndex === index">

                    <div class="flex items-center gap-4 flex-1 min-w-0">
                        <span class="font-mono text-orange-500 text-xs font-bold shrink-0"
                            [class.text-white]="activeStageIndex === index"
                            [class.text-orange-500]="activeStageIndex !== index">
                            {{ index < 9 ? '0' + (index + 1) : index + 1 }}
                        </span>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-google-sans text-base md:text-xl font-bold text-white tracking-tight truncate">
                                {{ stage.title }}
                            </h3>
                            <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-1 text-xs md:text-sm text-white/40 font-google-sans"
                                [class.text-white/80]="activeStageIndex === index"
                                [class.text-white/40]="activeStageIndex !== index">
                                <span>{{ stage.company }}</span>
                                <span class="hidden md:inline text-white/20" aria-hidden="true">•</span>
                                <span
                                    class="font-mono text-[9px] md:text-[10px] uppercase tracking-wider text-white/50 bg-white/5 px-2 py-0.5 border border-white/10 rounded-sm block md:inline-block w-fit"
                                    [class.text-white]="activeStageIndex === index"
                                    [class.bg-black/20]="activeStageIndex === index">
                                    {{ stage.period }}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center shrink-0 ml-4">
                        <div class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center transition-all duration-300 group-hover:border-orange-500/50"
                            [class.bg-orange-500]="activeStageIndex === index"
                            [class.border-orange-500]="activeStageIndex === index"
                            [class.shadow-[0_0_10px_rgba(249,115,22,0.5)]]="activeStageIndex === index">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round" class="transition-transform duration-500"
                                aria-hidden="true" focusable="false"
                                [class.text-white]="activeStageIndex === index"
                                [class.text-orange-500]="activeStageIndex !== index"
                                [class.rotate-180]="activeStageIndex === index">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>
                <div [id]="'stage-panel-' + index"
                    role="region"
                    [attr.aria-labelledby]="'stage-header-' + index"
                    class="grid transition-[grid-template-rows] duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]"
                    [style.grid-template-rows]="activeStageIndex === index ? '1fr' : '0fr'">
                    <div class="overflow-hidden">
                        <div class="p-6 pt-0 border-t border-white/5 bg-neutral-950/30">

                            <ul class="space-y-3 mt-6">
                                <li *ngFor="let point of stage.points; index as i" class="flex items-center gap-3">
                                    <span class="text-orange-500 text-md font-mono" aria-hidden="true">0{{i+1}}.</span>
                                    <p class="font-google-sans font-light text-white/70 text-sm md:text-base leading-relaxed">
                                        {{ point }}
                                    </p>
                                </li>
                            </ul>

                            <div class="flex flex-wrap gap-2 pt-6 mt-6 border-t border-white/5">
                                <span *ngFor="let tool of stage.tools"
                                    class="px-2.5 py-1 text-[10px] font-mono uppercase tracking-wider text-orange-500/80 border border-orange-500/20 bg-orange-500/5 hover:bg-orange-500/20 hover:text-orange-500 transition-all duration-300 rounded-sm cursor-default">
                                    {{ tool }}
                                </span>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<section aria-label="Technologies and Brands" class="relative w-full bg-neutral-950 py-12 border-y border-white/5 overflow-hidden">
    <div
        class="absolute inset-y-0 left-0 w-20 md:w-40 bg-linear-to-r from-neutral-950 to-transparent z-10 pointer-events-none" aria-hidden="true">
    </div>
    <div
        class="absolute inset-y-0 right-0 w-20 md:w-40 bg-linear-to-l from-neutral-950 to-transparent z-10 pointer-events-none" aria-hidden="true">
    </div>

    <div class="flex whitespace-nowrap">
        <div class="flex items-center marquee-container" aria-hidden="true">
            <div *ngFor="let item of items" class="flex items-center mx-12 group cursor-default">
                <span [innerHTML]="item.safeIcon"
                    class="w-8 h-8 md:w-10 md:h-10 mr-4 text-white/20 group-hover:text-orange-500 transition-colors duration-300 fill-current">
                </span>

                <span
                    class="font-google-sans text-2xl md:text-4xl font-bold uppercase tracking-tighter text-white/20 group-hover:text-orange-500 transition-colors duration-300">
                    {{ item.name }}
                </span>

                <span class="text-orange-500/10 ml-12 font-mono text-2xl md:text-4xl select-none">//</span>
            </div>
        </div>
    </div>
</section>
