<section id="career"
    class="relative min-h-screen w-full bg-neutral-950 py-24 px-6 md:px-12 border-t border-white/5 overflow-hidden">
    <div class="max-w-7xl mx-auto mb-16 grid grid-cols-1 md:grid-cols-[auto_1fr] gap-12">

        <div appReveal
            class="hidden md:flex flex-col items-center border-r border-white/10 pr-12 reveal-on-scroll reveal-right">
            <h2 class="font-google-sans text-6xl lg:text-8xl font-bold uppercase tracking-[0.2em] text-transparent select-none hover:text-orange-500 transition-colors duration-500"
                style="-webkit-text-stroke: 1px rgba(255, 255, 255, 0.15); writing-mode: vertical-lr; transform: rotate(180deg);">
                Career
            </h2>
            <div class="w-px h-24 bg-orange-500 mt-8"></div>
        </div>

        <div appReveal class="md:hidden reveal-on-scroll reveal-left">
            <h2 class="font-google-sans text-4xl font-bold uppercase tracking-widest text-orange-500 mb-4 text-center ">
                Career</h2>
            <div class="h-px w-12 bg-white/20 mx-auto"></div>
        </div>

        <div class="relative mt-12 md:mt-0">
            <div class="absolute left-1/2 top-0 h-full w-px bg-white/10 hidden md:block -translate-x-1/2">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-px h-20 bg-orange-500"></div>
            </div>

            <div class="space-y-8 md:space-y-0">
                <div *ngFor="let stage of careerStages; let isEven = even" appReveal
                    class="relative flex flex-col md:flex-row items-center justify-between w-full md:mb-16 reveal-on-scroll"
                    [ngClass]="isEven? 'reveal-right' : 'reveal-left'">

                    <div [class.md:invisible]="!isEven" [class.hidden]="!isEven"
                        class="w-full md:w-[45%] md:block order-1">
                        <ng-container
                            *ngTemplateOutlet="cardTemplate; context: { stage: stage, alignRight: false }"></ng-container>
                    </div>

                    <div
                        class="absolute left-1/2 top-10 h-3 w-3 rounded-full bg-orange-500 hidden md:block -translate-x-1/2 z-10 shadow-[0_0_15px_rgba(249, 115, 22, 0.6)]">
                    </div>

                    <div [class.md:invisible]="isEven" [class.hidden]="isEven"
                        class="w-full md:w-[45%] md:block order-1">
                        <ng-container
                            *ngTemplateOutlet="cardTemplate; context: { stage: stage, alignRight: true }"></ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<ng-template #cardTemplate let-stage="stage" let-alignRight="alignRight">
    <div class="relative p-6 md:p-8 border border-white/10 bg-white/5 transition-all duration-500 hover:border-orange-500/40 hover:bg-white/10"
        [style.clip-path]="'polygon(0% 0%, 97% 0%, 97% 30%, 100% 37%, 100% 100%, 37% 100%, 30% 97%, 0% 97%, 0% 50%)'">

        <div class="flex flex-col mb-4">
            <span class="font-google-sans text-orange-500 text-[10px] uppercase tracking-[0.3em] mb-1">
                {{ stage.period }}
            </span>
            <h3 class="font-google-sans text-xl font-bold text-white tracking-tight">{{ stage.title }}</h3>
            <p class="font-google-sans text-white/40 text-sm italic">{{ stage.company }}</p>
        </div>

        <ul class="space-y-3 mb-6">
            <li *ngFor="let point of stage.points" class="flex items-start gap-2">
                <span class="mt-2 h-1 w-1 rounded-full bg-orange-500 shrink-0"></span>
                <p class="font-google-sans font-light text-white/70 text-sm leading-relaxed">{{ point }}</p>
            </li>
        </ul>

        <div class="flex flex-wrap gap-2 pt-4 border-t border-white/5">
            <span *ngFor="let tool of stage.tools"
                class="px-2 py-1 text-[10px] font-mono uppercase tracking-wider text-orange-500/80 border border-orange-500/20 bg-orange-500/10 rounded-sm hover:bg-orange-500/20 transition-colors">
                {{ tool }}
            </span>
        </div>
    </div>
</ng-template>

<section class="relative w-full bg-neutral-950 py-12 border-y border-white/5 overflow-hidden">
    <div
        class="absolute inset-y-0 left-0 w-20 md:w-40 bg-linear-to-r from-neutral-950 to-transparent z-10 pointer-events-none">
    </div>
    <div
        class="absolute inset-y-0 right-0 w-20 md:w-40 bg-linear-to-l from-neutral-950 to-transparent z-10 pointer-events-none">
    </div>

    <div class="flex whitespace-nowrap">
        <div class="flex items-center marquee-container">
            <div *ngFor="let item of items" class="flex items-center mx-12 group cursor-default">
                <span [innerHTML]="item.safeIcon"
                    class="w-8 h-8 md:w-10 md:h-10 mr-4 text-white/20 group-hover:text-orange-500 transition-colors duration-300 fill-current">
                </span>

                <span
                    class="font-google-sans text-2xl md:text-4xl font-bold uppercase tracking-tighter text-white/20 group-hover:text-orange-500 transition-colors duration-300">
                    {{ item.name }}
                </span>

                <span class="text-orange-500/10 ml-12 font-mono text-2xl md:text-4xl select-none">//</span>
            </div>
        </div>
    </div>
</section>
