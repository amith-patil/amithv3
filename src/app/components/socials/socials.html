<div class="fixed bottom-0 left-6 flex flex-col items-center gap-6 z-50 transition-all duration-700 ease-in-out"
    [ngClass]="isScrolled ? 'opacity-0 -translate-y-10 pointer-events-none' : 'opacity-100 translate-y-0'">

    <div class="w-px lg:h-24 h-12 bg-white/40"></div>

    <div class="flex flex-col gap-5 pb-8">
        <a *ngFor="let social of socialLinks" [href]="social.url" target="_blank"
            class="text-white/20 hover:text-white hover:-translate-y-1 transition-all duration-300 ease-in-out"
            [title]="social.name">
            <i class="fab text-xl" [ngClass]="social.icon"></i>
        </a>
    </div>

</div>
