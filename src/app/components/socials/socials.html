<nav aria-label="Social Profiles" class="fixed bottom-0 left-6 flex flex-col items-center gap-6 z-50 transition-all duration-200 ease-in-out"
    [ngClass]="isScrolled ? 'opacity-0 -translate-y-10 pointer-events-none' : 'opacity-100 translate-y-0'">

    <div class="w-px lg:h-24 h-12 bg-white/40" aria-hidden="true"></div>

    <div class="flex flex-col gap-5 pb-8">
        <a *ngFor="let social of socialLinks" [href]="social.url" target="_blank" rel="noopener noreferrer"
            class="text-white/40 hover:text-white hover:-translate-y-1 transition-all duration-300 ease-in-out p-1 focus-visible:ring-2 focus-visible:ring-orange-500 rounded-sm focus-visible:outline-hidden"
            [attr.aria-label]="'Amith Patil on ' + social.name + ' (opens in a new tab)'">
            <i class="fab text-xl" [ngClass]="social.icon" aria-hidden="true"></i>
        </a>
    </div>

</nav>
